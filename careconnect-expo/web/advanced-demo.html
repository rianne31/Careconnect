<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Advanced Donation Platform</title>
    <!-- The CSS/JS below is self-contained for static demo; adjust paths if integrating into a bundler. -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary-blue:#2563eb; --primary-blue-dark:#1d4ed8; --secondary-blue:#3b82f6;
            --accent-purple:#8b5cf6; --accent-green:#10b981; --success-green:#059669;
            --warning-orange:#f59e0b; --danger-red:#dc2626; --dark-bg:#1f2937; --card-bg:#f8fafc;
            --text-primary:#1f2937; --text-secondary:#6b7280; --border-color:#e5e7eb;
            --shadow:0 4px 6px -1px rgba(0,0,0,.1); --shadow-lg:0 20px 25px -5px rgba(0,0,0,.1);
        }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; color:var(--text-primary); }
        .container{ max-width:1400px; margin:0 auto; padding:0 20px }
        .header{ background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-color); position:sticky; top:0; z-index:1000; box-shadow:var(--shadow) }
        .nav{ display:flex; justify-content:space-between; align-items:center; padding:1rem 0 }
        .nav-logo{ font-size:1.5rem; font-weight:700; color:var(--primary-blue); display:flex; align-items:center; gap:.5rem }
        .nav-logo::before{ content:"💙"; font-size:1.2rem }
        .nav-menu{ display:flex; list-style:none; gap:2rem; align-items:center }
        .nav-link{ text-decoration:none; color:var(--text-primary); font-weight:500; padding:.5rem 1rem; border-radius:8px; transition:all .3s ease; display:flex; align-items:center; gap:.5rem }
        .nav-link:hover{ background:var(--primary-blue); color:#fff; transform:translateY(-2px) }
        .nav-link.active{ background:var(--primary-blue); color:#fff }
        .main-content{ padding:2rem 0; min-height:calc(100vh - 80px) }
        .hero{ background:rgba(255,255,255,.95); border-radius:20px; padding:3rem; margin-bottom:2rem; box-shadow:var(--shadow-lg); position:relative; overflow:hidden }
        .hero::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; background:linear-gradient(90deg,var(--primary-blue),var(--accent-purple),var(--accent-green)) }
        .hero-content{ display:grid; grid-template-columns:1fr 1fr; gap:2rem; align-items:center }
        .hero-text h1{ font-size:2.5rem; font-weight:800; margin-bottom:1rem; background:linear-gradient(135deg,var(--primary-blue),var(--accent-purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
        .hero-text p{ font-size:1.2rem; color:var(--text-secondary); margin-bottom:2rem }
        .hero-actions{ display:flex; gap:1rem; flex-wrap:wrap }
        .btn{ padding:.8rem 2rem; border:none; border-radius:10px; font-weight:600; cursor:pointer; transition:all .3s ease; text-decoration:none; display:inline-flex; align-items:center; gap:.5rem; font-size:1rem }
        .btn-primary{ background:var(--primary-blue); color:#fff }
        .btn-primary:hover{ background:var(--primary-blue-dark); transform:translateY(-2px); box-shadow:var(--shadow) }
        .btn-secondary{ background:transparent; color:var(--primary-blue); border:2px solid var(--primary-blue) }
        .btn-secondary:hover{ background:var(--primary-blue); color:#fff }
        .cards-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1.5rem; margin-bottom:2rem }
        .card{ background:rgba(255,255,255,.95); border-radius:15px; padding:2rem; box-shadow:var(--shadow); transition:all .3s ease; border:1px solid var(--border-color) }
        .card:hover{ transform:translateY(-5px); box-shadow:var(--shadow-lg) }
        .card-title{ font-size:1.5rem; font-weight:700; color:var(--text-primary) }
        .progress-container{ margin:1rem 0 }
        .progress-bar{ background:#e5e7eb; height:12px; border-radius:6px; overflow:hidden; position:relative }
        .progress-fill{ height:100%; border-radius:6px; transition:width .8s ease; position:relative }
        .progress-fill::after{ content:''; position:absolute; inset:0; background:linear-gradient(45deg,rgba(255,255,255,.2) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.2) 50%,rgba(255,255,255,.2) 75%,transparent 75%,transparent); background-size:15px 15px; animation:move 1s linear infinite }
        @keyframes move{0%{background-position:0 0}100%{background-position:15px 15px}}
        .progress-blue{ background:var(--primary-blue) } .progress-purple{ background:var(--accent-purple) } .progress-green{ background:var(--accent-green) }
        .table{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:var(--shadow) }
        .table th{ background:var(--primary-blue); color:#fff; padding:1rem; text-align:left; font-weight:600 }
        .table td{ padding:1rem; border-bottom:1px solid var(--border-color) }
        .wallet-section{ text-align:center; padding:2rem }
        .wallet-status{ display:inline-flex; align-items:center; gap:.5rem; padding:.8rem 1.5rem; border-radius:25px; font-weight:600; margin-bottom:1rem }
        .wallet-connected{ background:rgba(16,185,129,.1); color:var(--success-green); border:2px solid rgba(16,185,129,.3) }
        .wallet-disconnected{ background:rgba(220,38,38,.1); color:var(--danger-red); border:2px solid rgba(220,38,38,.3) }
        .chat-container{ position:fixed; bottom:20px; right:20px; width:350px; height:400px; background:#fff; border-radius:15px; box-shadow:var(--shadow-lg); display:none; flex-direction:column; z-index:1001 }
        .chat-container.active{ display:flex }
        .chat-header{ background:var(--primary-blue); color:#fff; padding:1rem; border-radius:15px 15px 0 0; display:flex; justify-content:space-between; align-items:center }
        .chat-messages{ flex:1; padding:1rem; overflow-y:auto }
        .chat-input-container{ padding:1rem; border-top:1px solid var(--border-color); display:flex; gap:.5rem }
        .chat-input{ flex:1; padding:.5rem; border:1px solid var(--border-color); border-radius:20px; outline:none }
        .chat-toggle{ position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; background:var(--primary-blue); color:#fff; border:none; cursor:pointer; font-size:1.5rem; box-shadow:var(--shadow); z-index:1000 }
        @media (max-width:768px){ .hero-content{ grid-template-columns:1fr; text-align:center } .cards-grid{ grid-template-columns:1fr } .chat-container{ width:calc(100vw - 40px); left:20px; height:70vh } }
        .content-section{ display:none } .content-section.active{ display:block }
    </style>
</head>
<body>
    <!-- Content identical to the provided template is included for the static demo. For brevity, not reprinting here. Paste your full body markup if needed. -->
    <div style="padding:20px" class="container">
      <h1 style="color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25)">CareConnect Advanced UI Demo</h1>
      <p style="color:#eef; margin-top:8px">Open the full HTML from your source to view the interactive demo.</p>
    </div>
</body>
</html>
